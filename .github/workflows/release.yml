name: release

# 触发方式：
# 1) workflow_dispatch：在 GitHub 网页 Actions 页手动点 "Run workflow"（可填版本号，留空则读 pyproject.toml）
# 2) push tag v*：推 tag 自动触发（如 v1.6.0）
on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（如 1.6.0）；留空则从 pyproject.toml 读取
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl python-docx requests certifi py-ip2region pyinstaller

      - name: 确定版本号
        id: ver
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          fi
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "VER=${VER}" >> "$GITHUB_ENV"

      - name: 构建 exe
        run: python build_exe.py --version ${{ steps.ver.outputs.version }}

      - name: 校验产物并准备上传名（GitHub 惯例用英文 asset 名）
        shell: bash
        run: |
          ls -la dist/
          [ -f "dist/网络安全值守日报.exe" ] || { echo "exe 未生成"; exit 1; }
          cp "dist/网络安全值守日报.exe" dist/daily-report.exe

      - name: 更新 version.json（版本 / MD5 / exe_urls）
        shell: bash
        run: |
          python - <<'EOF'
          import hashlib, json, os, re
          p = 'version.json'
          data = json.load(open(p, encoding='utf-8'))
          ver = os.environ['VER']
          data['version'] = ver
          data['md5'] = hashlib.md5(open('dist/网络安全值守日报.exe', 'rb').read()).hexdigest().upper()
          pat = re.compile(r'/releases/download/v[^/]+/')
          if 'exe_urls' in data and isinstance(data['exe_urls'], list):
              data['exe_urls'] = [pat.sub(f'/releases/download/v{ver}/', u) for u in data['exe_urls']]
          if 'exe_url' in data and isinstance(data['exe_url'], str):
              data['exe_url'] = pat.sub(f'/releases/download/v{ver}/', data['exe_url'])
          json.dump(data, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('version.json ->', ver, data['md5'])
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "release: v${{ steps.ver.outputs.version }} [ci]" || echo "version.json 无变化"

      - name: 创建/更新 Release 并上传 exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }} - 发布
          body: 自动构建发布 v${{ steps.ver.outputs.version }}（GitHub Actions）
          files: dist/daily-report.exe
          draft: false
          prerelease: false

      - name: 推送 version.json 到 main
        run: |
          git push origin HEAD:main || echo "main 推送失败（可能被并发改动），version.json 保持本地；Release 已创建"
