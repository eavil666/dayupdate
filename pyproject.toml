[project]
name = "network-security-daily-report"
# 版本单一真源：build_exe.py / release.py 均从此处读取；发布新版本改这里即可
version = "1.7.0"
description = "网络安全值守保障日报整合工具（IP归属分析 + 值守日报）"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "openpyxl",
    "python-docx",
    "requests",
    "certifi",
    "py-ip2region",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# --cov：pytest 默认带覆盖率（配合下方 fail_under=50 门槛）
addopts = "-q --cov"

[tool.coverage.run]
# 覆盖率测量范围：5 个核心模块（main 为入口，体积小）
source = ["main", "common", "updater", "ipdb", "report"]
omit = ["tests/*"]

[tool.coverage.report]
# 覆盖率门槛：低于 50% 时 pytest --cov 失败（防改动大幅降覆盖）
fail_under = 50
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# F=pyflakes(未用导入/变量) E/W=pycodestyle I=import排序 UP=pyupgrade 现代化
select = ["F", "E", "W", "I", "UP"]
ignore = [
    "E501",   # 行长（120 内已限，个别长行可接受）
    "BLE001", # 盲捕获 Exception 是本项目健壮性模式（网络/文件操作）
    "S110",   # try-except-pass（失败静默有意为之）
    "S112",   # try-except-continue（同上）
    "DTZ005", # datetime.now 无时区（桌面工具不涉及时区）
]
